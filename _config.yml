# ------------------------------------------------------------------
# Site settings. Edit the text between the quotes, then commit.
# ------------------------------------------------------------------
title: "CEM Research Lab"
tagline: "Criminogenic Embeddedness Model research program"
description: "Research hub for the Criminogenic Embeddedness Model (CEM) and the Recovery Embeddedness Model (REM), by Dr. Donald Bowen."
author: "Donald Bowen, DBA"
email: "don@cemresearchlab.com"
webmail: "https://mail.cemresearchlab.com/?_task=mail&_mbox=INBOX"
orcid: "0000-0003-3527-9462"
site_doi: "10.5281/zenodo.22923742"
location: "Oceana, West Virginia"
url: "https://cemresearchlab.com"
lang: en_US

# Menu at the top of every page (in this order)
nav:
  - title: Home
    url: /
  - title: About
    url: /about/
  - title: CEM
    url: /cem/
  - title: REM
    url: /rem/
  - title: Publications
    url: /publications/
  - title: CV
    url: /cv/
  - title: Blog
    url: /blog/
  - title: Contact
    url: /contact/

# ------------------------------------------------------------------
# Technical settings - no need to change these.
# ------------------------------------------------------------------
permalink: /blog/:year/:month/:title/
markdown: kramdown
plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap
exclude:
  - README.md
  - HOW-TO-POST.md
  - POST-TEMPLATE.md

# Keep the private post-writing page out of search engines' sitemap
defaults:
  - scope:
      path: "post.html"
    values:
      sitemap: false
